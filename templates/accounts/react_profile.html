<script type="text/babel">
const { useState, useEffect } = React;

// --- COMMON COMPONENTS ---

const Modal = ({ isOpen, onClose, title, children }) => {
    if (!isOpen) return null;
    return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-900 bg-opacity-50 transition-opacity">
            <div className="bg-white rounded-xl shadow-xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
                <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                    <h3 className="text-xl font-bold text-gray-900">{title}</h3>
                    <button onClick={onClose} className="text-gray-400 hover:text-gray-600 focus:outline-none">
                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <div className="p-6 overflow-y-auto">
                    {children}
                </div>
            </div>
        </div>
    );
};

const ProfileSectionCard = ({ title, children, onEdit, onAdd }) => (
    <div className="bg-white rounded-xl p-6 border border-gray-200 shadow-sm relative mb-6">
        <div className="flex justify-between items-center mb-6">
            <h4 className="text-xl font-bold text-gray-900">{title}</h4>
            <div className="flex space-x-3 text-gray-500">
                {onAdd && (
                    <button onClick={onAdd} className="hover:text-indigo-600 transition focus:outline-none" title={`Add ${title}`}>
                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"></path></svg>
                    </button>
                )}
                {onEdit && (
                    <button onClick={onEdit} className="hover:text-indigo-600 transition focus:outline-none" title={`Edit ${title}`}>
                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </button>
                )}
            </div>
        </div>
        <div>
            {children}
        </div>
    </div>
);

// --- MODALS ---

const EditSummaryModal = ({ isOpen, onClose, summary, onSave }) => {
    const [text, setText] = useState(summary || "");
    const [saving, setSaving] = useState(false);
    
    useEffect(() => { setText(summary || ""); }, [summary, isOpen]);

    const handleSave = async () => {
        setSaving(true);
        await onSave({ summary: text });
        setSaving(false);
        onClose();
    };

    return (
        <Modal isOpen={isOpen} onClose={onClose} title="Edit Professional Summary">
            <textarea 
                className="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 min-h-[150px] p-3 border"
                value={text}
                onChange={(e) => setText(e.target.value)}
                placeholder="A short 2-3 sentence overview of your career goals."
            />
            <div className="mt-6 flex justify-end">
                <button onClick={onClose} className="px-4 py-2 text-gray-600 hover:text-gray-900 border border-transparent mr-2">Cancel</button>
                <button disabled={saving} onClick={handleSave} className="bg-indigo-600 text-white px-4 py-2 rounded font-medium hover:bg-indigo-700 disabled:opacity-50">
                    {saving ? 'Saving...' : 'Save'}
                </button>
            </div>
        </Modal>
    );
};

const EditSkillsModal = ({ isOpen, onClose, skills, onSave }) => {
    const [text, setText] = useState(skills || "");
    const [saving, setSaving] = useState(false);
    
    useEffect(() => { setText(skills || ""); }, [skills, isOpen]);

    const handleSave = async () => {
        setSaving(true);
        await onSave({ skills: text });
        setSaving(false);
        onClose();
    };

    return (
        <Modal isOpen={isOpen} onClose={onClose} title="Edit Skills">
            <textarea 
                className="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 min-h-[150px] p-3 border"
                value={text}
                onChange={(e) => setText(e.target.value)}
                placeholder="Python, SQL, React, ..."
            />
            <p className="mt-1 text-sm text-gray-500">Separated by commas.</p>
            <div className="mt-6 flex justify-end">
                <button onClick={onClose} className="px-4 py-2 text-gray-600 hover:text-gray-900 border border-transparent mr-2">Cancel</button>
                <button disabled={saving} onClick={handleSave} className="bg-indigo-600 text-white px-4 py-2 rounded font-medium hover:bg-indigo-700 disabled:opacity-50">
                    {saving ? 'Saving...' : 'Save'}
                </button>
            </div>
        </Modal>
    );
};

const EditEducationModal = ({ isOpen, onClose, educationItem, onSave, onDelete }) => {
    const [formData, setFormData] = useState({
        school: "", degree: "", field_of_study: "", start_month: "", start_year: "", end_month: "", end_year: "", grade: ""
    });
    const [saving, setSaving] = useState(false);
    
    useEffect(() => {
        if (educationItem) {
            setFormData(educationItem);
        } else {
            setFormData({ school: "", degree: "", field_of_study: "", start_month: "", start_year: "", end_month: "", end_year: "", grade: "" });
        }
    }, [educationItem, isOpen]);

    const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

    const handleSave = async () => {
        setSaving(true);
        await onSave(formData);
        setSaving(false);
        onClose();
    };
    
    const handleDelete = async () => {
        if (confirm('Delete this education entry?')) {
            setSaving(true);
            await onDelete(formData.id);
            setSaving(false);
            onClose();
        }
    };

    return (
        <Modal isOpen={isOpen} onClose={onClose} title={educationItem ? "Edit Education" : "Add Education"}>
            <div className="space-y-4">
                <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">School / University *</label>
                    <input type="text" name="school" value={formData.school} onChange={handleChange} className="w-full rounded border-gray-300 p-2 border focus:border-indigo-500 focus:ring-indigo-500" required />
                </div>
                <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Degree</label>
                    <input type="text" name="degree" value={formData.degree} onChange={handleChange} className="w-full rounded border-gray-300 p-2 border focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
                <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Field of Study</label>
                    <input type="text" name="field_of_study" value={formData.field_of_study} onChange={handleChange} className="w-full rounded border-gray-300 p-2 border focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
                
                <div className="grid grid-cols-2 gap-4">
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Start Year</label>
                        <input type="text" name="start_year" value={formData.start_year} onChange={handleChange} placeholder="e.g. 2019" className="w-full rounded border-gray-300 p-2 border focus:border-indigo-500 focus:ring-indigo-500" />
                    </div>
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">End Year</label>
                        <input type="text" name="end_year" value={formData.end_year} onChange={handleChange} placeholder="e.g. 2023 (Leave blank if present)" className="w-full rounded border-gray-300 p-2 border focus:border-indigo-500 focus:ring-indigo-500" />
                    </div>
                </div>
                
                <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Grade</label>
                    <input type="text" name="grade" value={formData.grade} onChange={handleChange} placeholder="e.g. 85%" className="w-full rounded border-gray-300 p-2 border focus:border-indigo-500 focus:ring-indigo-500" />
                </div>
            </div>
            <div className="mt-6 flex justify-between">
                <div>
                    {educationItem && (
                        <button disabled={saving} onClick={handleDelete} className="text-red-600 hover:text-red-800 font-medium px-2 py-2">Delete</button>
                    )}
                </div>
                <div className="flex">
                    <button onClick={onClose} className="px-4 py-2 text-gray-600 hover:text-gray-900 border border-transparent mr-2">Cancel</button>
                    <button disabled={saving || !formData.school} onClick={handleSave} className="bg-indigo-600 text-white px-4 py-2 rounded font-medium hover:bg-indigo-700 disabled:opacity-50">
                        {saving ? 'Saving...' : 'Save'}
                    </button>
                </div>
            </div>
        </Modal>
    );
};

const EditVisibilityModal = ({ isOpen, onClose, visibility, onSave }) => {
    const [vis, setVis] = useState(visibility || "public");
    const [saving, setSaving] = useState(false);
    
    useEffect(() => { setVis(visibility || "public"); }, [visibility, isOpen]);

    const handleSave = async () => {
        setSaving(true);
        await onSave({ visibility: vis });
        setSaving(false);
        onClose();
    };

    return (
        <Modal isOpen={isOpen} onClose={onClose} title="Edit Profile Visibility">
            <div className="space-y-4">
                <p className="text-sm text-gray-600 mb-4">Who can view your summary, education, and skills?</p>
                <select value={vis} onChange={(e) => setVis(e.target.value)} className="w-full border p-3 rounded border-gray-300 focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="public">Public</option>
                    <option value="connections_only">Connections Only</option>
                    <option value="private">Private</option>
                </select>
            </div>
            <div className="mt-6 flex justify-end">
                <button onClick={onClose} className="px-4 py-2 text-gray-600 hover:text-gray-900 mr-2">Cancel</button>
                <button disabled={saving} onClick={handleSave} className="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 disabled:opacity-50">
                    Save
                </button>
            </div>
        </Modal>
    );
};


// --- MAIN APP COMPONENT ---

const ProfileEditorApp = () => {
    const [profile, setProfile] = useState(null);
    const [loading, setLoading] = useState(true);
    
    // Modal states
    const [modals, setModals] = useState({
        summary: false,
        skills: false,
        visibility: false,
        education: false
    });
    const [activeEducation, setActiveEducation] = useState(null);

    const toggleModal = (modalName, state, extraData = null) => {
        if (modalName === 'education') setActiveEducation(extraData);
        setModals(prev => ({ ...prev, [modalName]: state }));
    };

    const fetchProfile = async () => {
        try {
            const res = await fetch('/accounts/api/profile/');
            const data = await res.json();
            setProfile(data);
            setLoading(false);
        } catch (e) {
            console.error("Failed to load profile", e);
        }
    };

    useEffect(() => {
        fetchProfile();
    }, []);

    const fetchHelper = async (url, method, body) => {
        const res = await fetch(url, {
            method: method,
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': window.CSRF_TOKEN
            },
            body: JSON.stringify(body)
        });
        if (res.ok) await fetchProfile(); // Refresh entire state
        return res;
    };

    const handleUpdateProfile = async (data) => fetchHelper('/accounts/api/profile/update/', 'POST', data);
    
    const handleSaveEducation = async (data) => {
        if (data.id) {
            await fetchHelper(`/accounts/api/profile/education/${data.id}/`, 'PUT', data);
        } else {
            await fetchHelper('/accounts/api/profile/education/', 'POST', data);
        }
    };
    
    const handleDeleteEducation = async (id) => fetchHelper(`/accounts/api/profile/education/${id}/`, 'DELETE', {});

    if (loading) return null; // Let the HTML skeleton show

    return (
        <div className="space-y-6 relative">
            
            <div className="flex justify-end mb-2">
                <button onClick={() => toggleModal('visibility', true)} className="text-sm text-gray-500 hover:text-indigo-600 flex items-center bg-white px-3 py-1.5 rounded-full border border-gray-200">
                    <svg className="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    Visibility: <span className="font-semibold ml-1 capitalize">{profile.visibility.replace('_', ' ')}</span>
                </button>
            </div>

            {/* Summary Card */}
            <ProfileSectionCard title="Professional Summary" onEdit={() => toggleModal('summary', true)}>
                <p className="text-gray-700 whitespace-pre-wrap">{profile.summary || <span className="italic text-gray-400">No summary provided.</span>}</p>
            </ProfileSectionCard>

            {/* Education Card */}
            <ProfileSectionCard title="Education" onAdd={() => toggleModal('education', true, null)}>
                {profile.educations && profile.educations.length > 0 ? (
                    <div className="space-y-6">
                        {profile.educations.map(edu => (
                            <div key={edu.id} className="flex items-start border-b border-gray-50 pb-4 last:border-0 relative group">
                                <div className="w-12 h-12 bg-gray-100 rounded flex items-center justify-center text-gray-500 mr-4 flex-shrink-0 mt-1">
                                    <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2.12-1.15V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>
                                </div>
                                <div className="flex-grow">
                                    <h5 className="text-base font-bold text-gray-900">{edu.school}</h5>
                                    <p className="text-sm text-gray-800">{edu.degree}{edu.field_of_study && ` in ${edu.field_of_study}`}</p>
                                    <p className="text-sm text-gray-500 mt-0.5">{edu.start_year || 'Unknown'} - {edu.end_year || 'Present'}</p>
                                    {edu.grade && <p className="text-sm text-gray-600 mt-1">Grade: {edu.grade}</p>}
                                </div>
                                <button onClick={() => toggleModal('education', true, edu)} className="text-gray-400 hover:text-indigo-600 p-2 opacity-0 group-hover:opacity-100 transition">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                </button>
                            </div>
                        ))}
                    </div>
                ) : (
                    <p className="text-gray-500 italic text-sm">Not specified</p>
                )}
            </ProfileSectionCard>

            {/* Skills Card */}
            <ProfileSectionCard title="Skills" onEdit={() => toggleModal('skills', true)}>
                {profile.skills ? (
                    <div className="flex flex-wrap gap-2">
                        {profile.skills.split(',').map((skill, i) => (
                            <span key={i} className="bg-gray-100 text-gray-800 px-3 py-1 rounded-md text-sm font-medium border border-gray-200">
                                {skill.trim()}
                            </span>
                        ))}
                    </div>
                ) : (
                    <p className="text-gray-500 italic text-sm">Not specified</p>
                )}
            </ProfileSectionCard>

            {/* Render Modals */}
            <EditSummaryModal isOpen={modals.summary} onClose={() => toggleModal('summary', false)} summary={profile.summary} onSave={handleUpdateProfile} />
            <EditSkillsModal isOpen={modals.skills} onClose={() => toggleModal('skills', false)} skills={profile.skills} onSave={handleUpdateProfile} />
            <EditVisibilityModal isOpen={modals.visibility} onClose={() => toggleModal('visibility', false)} visibility={profile.visibility} onSave={handleUpdateProfile} />
            <EditEducationModal isOpen={modals.education} onClose={() => toggleModal('education', false)} educationItem={activeEducation} onSave={handleSaveEducation} onDelete={handleDeleteEducation} />

        </div>
    );
};

const rootStyle = document.getElementById('react-profile-root');
if (rootStyle) {
    const root = ReactDOM.createRoot(rootStyle);
    root.render(<ProfileEditorApp />);
}
</script>
