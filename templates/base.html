<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Secure Job Portal{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col">
    <nav class="bg-white shadow-sm w-full z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="{% url 'home' %}" class="flex-shrink-0 flex items-center">
                        <span class="font-bold text-2xl text-indigo-600 tracking-tight">JobPortal</span>
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    {% if user.is_authenticated %}
                        <span class="text-gray-700 font-medium">Hello, {{ user.first_name|default:user.email }}</span>
                        {% if user.role == "CANDIDATE" %}
                            <a href="{% url 'candidate_dashboard' %}" class="text-gray-600 hover:text-indigo-600 font-medium transition">Dashboard</a>
                        {% elif user.role == "EMPLOYER" %}
                            <a href="{% url 'employer_dashboard' %}" class="text-gray-600 hover:text-indigo-600 font-medium transition">Dashboard</a>
                        {% endif %}
                        <a href="{% url 'logout' %}" class="text-red-500 hover:text-red-700 font-medium transition">Logout</a>
                    {% else %}
                        <a href="{% url 'role_selection' action='login' %}" class="text-gray-600 hover:text-indigo-600 font-medium transition">Login</a>
                        <a href="{% url 'role_selection' action='register' %}" class="bg-indigo-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-indigo-700 transition shadow">Sign Up</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4 relative">
        <!-- Abstract Background Shapes -->
        <div class="absolute top-0 -left-4 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
        <div class="absolute top-0 -right-4 w-72 h-72 bg-yellow-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-8 left-20 w-72 h-72 bg-pink-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-4000"></div>

        <div class="relative w-full max-w-5xl">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
