{% extends 'base.html' %}

{% block content %}
<div class="flex justify-center z-10 w-full animate-fade-in-up mt-16">
    <div class="glass-panel rounded-2xl shadow-xl w-full max-w-md p-10 text-center">

        <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                </path>
            </svg>
        </div>

        <h2 class="text-3xl font-bold text-gray-900 mb-2">Two-Factor Authentication</h2>
        <p class="text-gray-500 mb-8">Enter the 6-digit code from your authenticator app to continue logging in.</p>

        <form method="post" class="space-y-6 text-left">
            {% csrf_token %}

            {% if messages %}
            <div id="flash-messages">
                {% for message in messages %}
                <div
                    class="bg-red-50 text-red-600 p-3 rounded text-sm text-center mb-4 transition-opacity duration-500">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            <script>
                setTimeout(function () {
                    let container = document.getElementById('flash-messages');
                    if (container) {
                        container.style.opacity = '0';
                        setTimeout(() => container.remove(), 500);
                    }
                }, 4000);
            </script>
            {% endif %}

            <div class="max-w-xs mx-auto">
                <input type="text" name="token" id="token"
                    class="block w-full text-center tracking-[0.5em] font-mono rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 text-3xl py-4 border"
                    required maxlength="10" placeholder="123456" autofocus autocomplete="one-time-code">
            </div>

            <button type="submit"
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition mt-6">
                Verify and Login
            </button>
        </form>
    </div>
</div>

<style>
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .animate-fade-in-up {
        animation: fadeInUp 0.4s ease-out forwards;
    }
</style>
{% endblock %}
